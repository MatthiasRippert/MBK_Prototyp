name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototyp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototyp/package-lock.json
      - run: npm ci
      - run: npx ng build --base-href /MBK_Prototyp/
      - name: SPA fallback
        run: cp dist/prototyp/browser/index.html dist/prototyp/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototyp/dist/prototyp/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
